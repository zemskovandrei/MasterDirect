name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use site-root base href for custom domain
        run: |
          printf '%s\n' \
            '/**' \
            ' * Custom domain: https://masterdirect.ge/' \
            ' */' \
            "export const APP_BASE_HREF_VALUE = '/';" \
            > src/app/core/config/base-href.github-pages.ts

      - name: Build for GitHub Pages
        run: npm run build:pages

      - name: Verify build output
        run: test -f dist/pro-remont/browser/index.html

      - name: Normalize SPA entrypoint for GitHub Pages
        run: |
          if [ -f dist/pro-remont/browser/index.csr.html ]; then
            cp dist/pro-remont/browser/index.csr.html dist/pro-remont/browser/index.html
          fi

      - name: SPA fallback for client routes
        run: |
          cp dist/pro-remont/browser/index.html dist/pro-remont/browser/404.html
          cp public/.nojekyll dist/pro-remont/browser/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pro-remont/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
