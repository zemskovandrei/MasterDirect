<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bluegradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D47A1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1976D2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42A5F5;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Light background for favicon -->
  <rect width="180" height="180" fill="white"/>
  
  <!-- Professional Logo Mark -->
  <g transform="translate(15, 15)" filter="url(#shadow)">
    <!-- Left side M - vertical lines -->
    <path d="M 40 155 L 40 50" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 110 155 L 110 50" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    
    <!-- M peak - diagonal lines meeting at top -->
    <path d="M 40 50 L 75 15 L 110 50" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Right side D - vertical line -->
    <path d="M 130 155 L 130 50" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    
    <!-- D curve - right bulge -->
    <path d="M 130 70 Q 175 62 180 105 Q 175 148 130 155" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Roof top - connecting peak -->
    <path d="M 40 50 L 130 50" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    
    <!-- House base/foundation line -->
    <path d="M 40 155 L 130 155" stroke="url(#bluegradient)" stroke-width="14" stroke-linecap="round" fill="none"/>
    
    <!-- Checkmark inside M -->
    <path d="M 55 105 L 68 120 L 95 80" stroke="white" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <!-- Dynamic arrow pointing up-right -->
    <g>
      <!-- Main arrow line -->
      <path d="M 120 140 L 175 70" stroke="url(#bluegradient)" stroke-width="11" stroke-linecap="round" fill="none"/>
      <!-- Arrow head -->
      <polygon points="175,70 165,80 172,92" fill="url(#bluegradient)"/>
    </g>
    
    <!-- Connecting dot for M and D -->
    <circle cx="120" cy="155" r="5" fill="url(#bluegradient)"/>
  </g>
</svg>