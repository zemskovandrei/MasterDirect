<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>MASTERDIRECT</title>
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages SPA fallback: keep path for client router (build also overwrites with index.html).
      (function () {
        var l = window.location;
        var path = l.pathname || '/';
        if (path !== '/' && path !== '/index.html') {
          sessionStorage.setItem('md_spa_path', path + (l.search || '') + (l.hash || ''));
        }
        l.replace('/' + (l.search || '') + (l.hash || ''));
      })();
    </script>
    <meta http-equiv="refresh" content="0; url=/" />
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
