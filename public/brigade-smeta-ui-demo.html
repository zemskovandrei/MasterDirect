<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartBuild.Tech — выбор бригады и смета (демо)</title>
    <style>
      /* ===================== CSS ===================== */
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #101426;
        --muted: #5c6478;
        --accent: #00d4ff;
        --accent-dark: #00a8c8;
        --radius: 16px;
        --transition: 0.3s ease;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }

      .page {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
        display: grid;
        gap: 1.5rem;
      }

      .brand {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 800;
      }

      /* --- Блок 1: выбор бригады --- */
      #brigade-section {
        padding: 1.5rem;
        border-radius: var(--radius);
        border: 1px solid rgba(16, 20, 38, 0.12);
        background: var(--card);
        transition:
          border-color 0.45s ease,
          box-shadow 0.45s ease;
      }

      #brigade-section h2 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
      }

      #brigade-section p {
        margin: 0 0 1.25rem;
        color: var(--muted);
      }

      .brigade-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }

      .brigade-card {
        padding: 1rem;
        border-radius: 12px;
        border: 1px solid rgba(16, 20, 38, 0.1);
        background: #fafbfd;
        cursor: pointer;
        transition:
          border-color var(--transition),
          box-shadow var(--transition),
          transform var(--transition);
      }

      .brigade-card:hover {
        transform: translateY(-2px);
        border-color: rgba(0, 212, 255, 0.35);
      }

      .brigade-card.is-selected {
        border-color: rgba(0, 212, 255, 0.6);
        box-shadow: 0 0 0 1px rgba(0, 212, 255, 0.25);
      }

      .brigade-card h3 {
        margin: 0 0 0.35rem;
        font-size: 1.05rem;
      }

      .brigade-card span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      /* Пульсация при hover на заблокированную кнопку сметы */
      #brigade-section.attention-pulse {
        animation: attention-pulse 1.1s ease-in-out infinite;
        border-color: rgba(0, 212, 255, 0.75);
      }

      @keyframes attention-pulse {
        0%,
        100% {
          box-shadow:
            0 0 0 1px rgba(0, 212, 255, 0.3),
            0 0 18px rgba(0, 212, 255, 0.18);
          transform: translateY(0);
        }
        50% {
          box-shadow:
            0 0 0 2px rgba(0, 212, 255, 0.55),
            0 0 32px rgba(0, 212, 255, 0.32);
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #brigade-section.attention-pulse {
          animation: none;
          box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.5);
        }
      }

      /* --- Блок 2: смета --- */
      #smeta-section {
        padding: 1.5rem;
        border-radius: var(--radius);
        border: 1px solid rgba(16, 20, 38, 0.12);
        background: var(--card);
      }

      #smeta-section h2 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }

      #smeta-section p {
        margin: 0 0 1rem;
        color: var(--muted);
      }

      /* Обёртка: disabled-кнопка не ловит mouseenter, события вешаем на wrap */
      .smeta-btn-wrap {
        display: inline-block;
      }

      #smeta-btn {
        min-width: 220px;
        padding: 0.85rem 1.5rem;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #00d4ff, #00f0b5);
        color: var(--text);
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          box-shadow 0.25s ease;
      }

      #smeta-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        box-shadow: none;
      }

      #smeta-btn:not(:disabled):hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0, 212, 255, 0.28);
      }

      @media (max-width: 600px) {
        .brigade-grid {
          grid-template-columns: 1fr;
        }

        #smeta-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===================== HTML ===================== -->
    <main class="page">
      <h1 class="brand">SmartBuild.Tech</h1>

      <!-- Блок 1: выбор бригады -->
      <section id="brigade-section" aria-label="Выбор бригады">
        <h2>Выберите бригаду</h2>
        <p>Кликните по карточке, чтобы активировать просмотр сметы.</p>

        <div class="brigade-grid" id="brigade-grid">
          <article class="brigade-card" data-brigade-id="brigade-1">
            <h3>Бригада «СтройКомфорт»</h3>
            <span>Ремонт квартир под ключ</span>
          </article>
          <article class="brigade-card" data-brigade-id="brigade-2">
            <h3>Бригада «МастерДом»</h3>
            <span>Отделка и черновые работы</span>
          </article>
          <article class="brigade-card" data-brigade-id="brigade-3">
            <h3>Бригада «ПроРемонт»</h3>
            <span>Капитальный ремонт</span>
          </article>
        </div>
      </section>

      <!-- Блок 2: смета -->
      <section id="smeta-section" aria-label="Смета">
        <h2>Выберите бригаду для расчета сметы</h2>

        <span class="smeta-btn-wrap" id="smeta-btn-wrap">
          <button type="button" id="smeta-btn" disabled>Смета</button>
        </span>
      </section>
    </main>

    <script>
      /* ===================== JavaScript ===================== */
      (function () {
        // --- Состояние ---
        let isBrigadeSelected = false;
        let selectedBrigadeId = null;

        // --- DOM-элементы ---
        const brigadeSection = document.getElementById('brigade-section');
        const brigadeGrid = document.getElementById('brigade-grid');
        const smetaBtn = document.getElementById('smeta-btn');
        const smetaBtnWrap = document.getElementById('smeta-btn-wrap');
        const smetaStatus = document.getElementById('smeta-status');

        // Включаем подсветку блока бригад
        function enableBrigadeAttention() {
          brigadeSection.classList.add('attention-pulse');
        }

        // Выключаем подсветку блока бригад
        function disableBrigadeAttention() {
          brigadeSection.classList.remove('attention-pulse');
        }

        // Обновляем UI кнопки сметы по состоянию
        function updateSmetaButton() {
          smetaBtn.disabled = !isBrigadeSelected;

          if (isBrigadeSelected) {
            smetaStatus.textContent = 'Бригада выбрана. Можно открыть смету.';
            disableBrigadeAttention();
          } else {
            smetaStatus.textContent = 'Сначала выберите бригаду выше.';
          }
        }

        // Hover на заблокированную кнопку → подсветка секции бригад
        // События на обёртке: у disabled-кнопки mouseenter не срабатывает в браузерах
        smetaBtnWrap.addEventListener('mouseenter', function () {
          if (!isBrigadeSelected && smetaBtn.disabled) {
            enableBrigadeAttention();
          }
        });

        smetaBtnWrap.addEventListener('mouseleave', function () {
          disableBrigadeAttention();
        });

        // Клик по карточке бригады
        brigadeGrid.addEventListener('click', function (event) {
          const card = event.target.closest('.brigade-card');
          if (!card) return;

          selectedBrigadeId = card.dataset.brigadeId;
          isBrigadeSelected = true;

          // Визуально отмечаем выбранную карточку
          brigadeGrid.querySelectorAll('.brigade-card').forEach(function (item) {
            item.classList.toggle('is-selected', item === card);
          });

          updateSmetaButton();
        });

        // Клик по активной кнопке сметы
        smetaBtn.addEventListener('click', function () {
          if (!isBrigadeSelected) return;
          alert('Открываем смету для: ' + selectedBrigadeId);
        });

        // Начальное состояние
        updateSmetaButton();
      })();
    </script>
  </body>
</html>
