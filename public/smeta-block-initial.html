<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Смета — начальное состояние</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f4f6fb;
        color: #101426;
      }

      /* --- Блок сметы: состояние 1 (бригада не выбрана) --- */
      .smeta-block {
        width: min(100%, 28rem);
        padding: 2rem;
        border-radius: 1rem;
        background: #fff;
        border: 1px solid rgba(16, 20, 38, 0.08);
        box-shadow: 0 8px 32px rgba(16, 20, 38, 0.06);
      }

      .smeta-block__title {
        margin: 0 0 1.25rem;
        font-size: 1.25rem;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: -0.02em;
        color: #101426;
      }

      .smeta-block__btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 12rem;
        min-height: 2.75rem;
        padding: 0.75rem 1.5rem;
        border: none;
        border-radius: 999px;
        background: #9aa3b5;
        color: #fff;
        font: inherit;
        font-size: 0.95rem;
        font-weight: 600;
        opacity: 0.5;
        cursor: not-allowed;
      }

      /* Контакты бригадира — скрыты до выбора бригады */
      .smeta-block__contacts {
        display: none;
      }
    </style>
  </head>
  <body>
    <!--
      Состояние 1: бригада не выбрана.
      Только заголовок + заблокированная кнопка.
    -->
    <section class="smeta-block" id="smeta-section" aria-label="Расчёт сметы">
      <h2 class="smeta-block__title">Выберите бригаду для расчета сметы</h2>

      <button type="button" class="smeta-block__btn" id="smeta-btn" disabled>
        Смета
      </button>

      <!-- Появится в состоянии 2 после выбора бригады -->
      <div class="smeta-block__contacts" id="smeta-contacts" aria-hidden="true">
        <p class="smeta-block__contacts-name">Иван Петров</p>
        <a href="tel:+79001234567">+7 (900) 123-45-67</a>
        <a href="mailto:brigadier@example.com">brigadier@example.com</a>
      </div>
    </section>
  </body>
</html>
