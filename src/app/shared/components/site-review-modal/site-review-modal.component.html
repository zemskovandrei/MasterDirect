@if (open()) {
  <div class="site-review-overlay" (click)="close()">
    <div
      class="site-review-dialog"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="translation.t('siteReview.title')"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="site-review-dialog__close" (click)="close()" aria-label="×">
        ×
      </button>
      <span class="section-eyebrow">{{ translation.t('siteReview.eyebrow') }}</span>
      <h2>{{ translation.t('siteReview.title') }}</h2>
      <p class="site-review-dialog__lead">{{ translation.t('siteReview.lead') }}</p>

      @if (submitSuccess()) {
        <p class="site-review-dialog__success" role="status">
          {{ translation.t('siteReview.success') }}
        </p>
      } @else {
        <form class="site-review-dialog__form" [formGroup]="reviewForm" (ngSubmit)="submitReview()">
          <label class="site-review-dialog__field">
            <span>{{ translation.t('siteReview.nameLabel') }}</span>
            <input
              type="text"
              formControlName="userName"
              autocomplete="name"
              [attr.placeholder]="translation.t('siteReview.namePlaceholder')"
            />
            @if (fieldInvalid('userName')) {
              <small class="site-review-dialog__error">{{
                translation.t('siteReview.nameError')
              }}</small>
            }
          </label>

          <label class="site-review-dialog__field">
            <span>{{ translation.t('siteReview.textLabel') }}</span>
            <textarea
              formControlName="reviewText"
              rows="4"
              [attr.placeholder]="translation.t('siteReview.textPlaceholder')"
            ></textarea>
            @if (fieldInvalid('reviewText')) {
              <small class="site-review-dialog__error">{{
                translation.t('siteReview.textError')
              }}</small>
            }
          </label>

          @if (submitError()) {
            <p class="site-review-dialog__error" role="alert">{{ submitError() }}</p>
          }

          <button
            type="submit"
            class="btn-primary site-review-dialog__submit"
            [disabled]="submitting()"
          >
            {{
              submitting()
                ? translation.t('siteReview.submitting')
                : translation.t('siteReview.submit')
            }}
          </button>
        </form>
      }
    </div>
  </div>
}
